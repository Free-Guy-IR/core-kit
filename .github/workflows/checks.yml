name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Build, Dist, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Fetch sibling config kits
        run: |
          KITS="openvpn-config-kit@15ec50c87fd6a3d48cf7d1dc57b3eb0cddc9fab4 mtproto-config-kit@8eb84713f38e192c168b2d1cebb306fabe843795 l2tp-config-kit@fce077c58e97ae566f20aefdbbcec13a8ff869eb singbox-config-kit@9e2126dc7d146d7717016ac81833f61ac7680bb0 wireguard-config-kit@e55aff7f46ad71e5ebc697d324f5fa0dce074dd3"
          for entry in $KITS; do
              kit="${entry%%@*}"
              ref="${entry#*@}"
              dir="$GITHUB_WORKSPACE/../$kit"
              git clone --filter=blob:none --no-checkout "https://github.com/${{ github.repository_owner }}/$kit.git" "$dir"
              git -C "$dir" checkout --detach "$ref"
              got="$(git -C "$dir" rev-parse HEAD)"
              if [ "$got" != "$ref" ]; then
                  echo "::error::$kit resolved to $got, expected $ref"
                  exit 1
              fi
          done
          for entry in $KITS; do
              (cd "$GITHUB_WORKSPACE/../${entry%%@*}" && bun install --frozen-lockfile)
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check committed dist matches a clean build
        run: |
          rm -rf dist
          bun run build
          git status --porcelain --untracked-files=all -- dist
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"

      - name: Test
        run: bun run test
